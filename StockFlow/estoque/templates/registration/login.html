<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - StockFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f4f6f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .login-card {
            max-width: 400px;
            width: 100%;
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>

<body>

    <div class="card login-card p-4 p-sm-5">
        <div class="text-center mb-4">
            <h3 class="fw-bold"><i class="bi bi-layers-fill text-success"></i> StockFlow</h3>
            <p class="text-muted small">Faça login para acessar o painel</p>
        </div>

        {% if form.errors %}
        <div class="alert alert-danger py-2 small">
            Usuário ou senha incorretos. Tente novamente.
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-medium small">Usuário</label>
                <input type="text" name="username" class="form-control form-control-lg fs-6" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label fw-medium small">Senha</label>
                <input type="password" name="password" class="form-control form-control-lg fs-6" required>
            </div>
            <button type="submit" class="btn btn-success btn-lg w-100 fw-bold fs-6">Entrar</button>
        </form>
    </div>

</body>

</html>
