<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Fornecedor - StockFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f4f6f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .form-container {
            max-width: 700px;
            margin: 0 auto;
        }
    </style>
</head>

<body>
    <div class="container-fluid py-4 py-md-5">
        <div class="form-container">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-header bg-white border-bottom-0 pt-4 pb-2 px-4 px-md-5">
                    <h4 class="fw-bold mb-0"><i class="bi bi-building-add text-primary"></i> Cadastrar Fornecedor</h4>
                </div>
                <div class="card-body p-4 p-md-5 pt-3">
                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label fw-medium">Nome da Empresa</label>
                            {{ form.nome }}
                        </div>

                        <div class="row mb-3 g-3">
                            <div class="col-12 col-md-6">
                                <label class="form-label fw-medium">CNPJ</label>
                                {{ form.cnpj }}
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label fw-medium">Telefone</label>
                                {{ form.telefone }}
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-medium">E-mail de Contato</label>
                            {{ form.email }}
                        </div>

                        <hr class="text-muted">

                        <div class="d-flex flex-column flex-sm-row justify-content-end gap-2 mt-4">
                            <a href="{% url 'fornecedor_lista' %}" class="btn btn-light border w-100 text-center"
                                style="max-width: 150px;">Cancelar</a>
                            <button type="submit" class="btn btn-primary px-4 fw-bold w-100"
                                style="max-width: 200px;">Salvar Fornecedor</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
