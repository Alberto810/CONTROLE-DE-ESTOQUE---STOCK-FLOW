<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Produto - StockFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f4f6f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .form-container {
            max-width: 800px;
            margin: 0 auto;
        }
    </style>
</head>

<body>
    <div class="container-fluid py-4 py-md-5">
        <div class="form-container">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-header bg-white border-bottom-0 pt-4 pb-2 px-4 px-md-5">
                    <h4 class="fw-bold mb-0"><i class="bi bi-box-seam text-success"></i> Adicionar Novo Produto</h4>
                </div>
                <div class="card-body p-4 p-md-5 pt-3">
                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label fw-medium">Nome do Produto</label>
                            {{ form.nome }}
                        </div>

                        <div class="row mb-3 g-3">
                            <div class="col-12 col-md-6">
                                <label class="form-label fw-medium">Código SKU</label>
                                {{ form.sku }}
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label fw-medium">Fornecedor</label>
                                {{ form.fornecedor }}
                            </div>
                        </div>

                        <div class="row mb-4 g-3">
                            <div class="col-12 col-sm-6 col-md-3">
                                <label class="form-label fw-medium">Custo (R$)</label>
                                {{ form.preco_custo }}
                            </div>
                            <div class="col-12 col-sm-6 col-md-3">
                                <label class="form-label fw-medium">Venda (R$)</label>
                                {{ form.preco_venda }}
                            </div>
                            <div class="col-12 col-sm-6 col-md-3">
                                <label class="form-label fw-medium">Estoque Mín.</label>
                                {{ form.estoque_minimo }}
                            </div>
                            <div class="col-12 col-sm-6 col-md-3">
                                <label class="form-label fw-bold text-success">Estoque Inicial</label>
                                {{ form.estoque_inicial }}
                            </div>
                        </div>

                        <hr class="text-muted">

                        <!-- Botões ficam empilhados no celular (flex-column) e lado a lado no desktop (flex-sm-row) -->
                        <div class="d-flex flex-column flex-sm-row justify-content-end gap-2 mt-4">
                            <a href="{% url 'dashboard' %}" class="btn btn-light border w-100 text-center"
                                style="max-width: 150px;">Cancelar</a>
                            <button type="submit" class="btn btn-success px-4 fw-bold w-100"
                                style="max-width: 200px;">Salvar Produto</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
