<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Novo Produto - StockFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                <h4 class="fw-bold"><i class="bi bi-box-seam text-success"></i> Adicionar Novo Produto</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label fw-medium">Nome do Produto</label>
                        {{ form.nome }}
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-medium">Código SKU</label>
                            {{ form.sku }}
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-medium">Fornecedor</label>
                            {{ form.fornecedor }}
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label fw-medium">Custo (R$)</label>
                            {{ form.preco_custo }}
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-medium">Venda (R$)</label>
                            {{ form.preco_venda }}
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-medium">Estoque Mín.</label>
                            {{ form.estoque_minimo }}
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{% url 'dashboard' %}" class="btn btn-light">Cancelar</a>
                        <button type="submit" class="btn btn-success px-4">Salvar Produto</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
