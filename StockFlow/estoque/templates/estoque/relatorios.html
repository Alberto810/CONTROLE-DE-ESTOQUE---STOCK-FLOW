<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Relatórios - StockFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f4f6f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .content-wrapper {
            max-width: 900px;
            margin: 0 auto;
        }

        .border-dashed {
            border: 2px dashed #dee2e6 !important;
        }
    </style>
</head>

<body class="p-3 p-md-4 py-lg-5">

    <div class="content-wrapper bg-white p-3 p-md-4 p-lg-5 rounded-4 shadow-sm">

        <div
            class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center mb-5 gap-3">
            <div>
                <h4 class="fw-bold mb-1"><i class="bi bi-file-earmark-bar-graph text-primary"></i> Central de Relatórios
                </h4>
                <span class="text-muted small">Exporte os dados consolidados do sistema</span>
            </div>
            <a href="{% url 'dashboard' %}" class="btn btn-light border shadow-sm w-100 w-sm-auto text-nowrap">
                <i class="bi bi-arrow-left"></i> Voltar
            </a>
        </div>

        <div class="row g-4">
            <!-- Card: Relatório Geral de Estoque -->
            <div class="col-12 col-md-6">
                <div class="card h-100 border-0 shadow-sm rounded-4 bg-light transition-hover">
                    <div class="card-body p-4 p-md-5 text-center">
                        <div class="mb-4">
                            <i class="bi bi-file-earmark-pdf-fill text-danger" style="font-size: 3.5rem;"></i>
                        </div>
                        <h5 class="fw-bold">Estoque Geral</h5>
                        <p class="text-muted small mb-4">Lista completa de produtos, SKUs, quantidades em estoque e
                            status atual.</p>

                        <!-- Aqui mantemos a rota antiga que gera o PDF -->
                        <a href="{% url 'relatorio_estoque_pdf' %}" class="btn btn-primary w-100 shadow-sm fw-bold">
                            <i class="bi bi-download me-2"></i> Baixar PDF
                        </a>
                    </div>
                </div>
            </div>

            <!-- Espaço reservado para futuros relatórios -->
            <div class="col-12 col-md-6">
                <div class="card h-100 border-dashed rounded-4 bg-transparent d-flex align-items-center justify-content-center"
                    style="min-height: 280px;">
                    <div class="text-center text-muted opacity-50">
                        <i class="bi bi-plus-circle fs-1 d-block mb-3"></i>
                        <span class="fw-medium">Novos relatórios em breve</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

</body>

</html>
