<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excluir Fornecedor - StockFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f4f6f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
        }

        .confirm-card {
            max-width: 450px;
            width: 100%;
        }
    </style>
</head>

<body>

    <div class="card confirm-card border-0 shadow-sm rounded-4 p-4 p-sm-5 text-center">
        <div class="text-danger mb-3">
            <i class="bi bi-exclamation-triangle-fill" style="font-size: 3rem;"></i>
        </div>
        <h4 class="fw-bold mb-3">Atenção!</h4>
        <p class="text-muted mb-2">Você está prestes a excluir o fornecedor <strong class="text-dark">
            {{ fornecedor.nome }}</strong>.</p>
        <p class="text-danger small fw-medium mb-4 bg-danger bg-opacity-10 py-2 rounded">Cuidado: Se existirem produtos
            vinculados a este fornecedor, a exclusão pode ser bloqueada ou afetar esses itens.</p>

        <form method="POST" class="w-100">
            {% csrf_token %}
            <div class="d-flex flex-column flex-sm-row gap-2 justify-content-center">
                <a href="{% url 'fornecedor_lista' %}" class="btn btn-light border px-4 w-100">Cancelar</a>
                <button type="submit" class="btn btn-danger px-4 w-100 fw-bold shadow-sm">Sim, Excluir</button>
            </div>
        </form>
    </div>

</body>

</html>
