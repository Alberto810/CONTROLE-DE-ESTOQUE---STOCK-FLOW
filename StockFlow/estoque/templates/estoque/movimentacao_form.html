<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Nova Movimentação - StockFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow-sm border-0 rounded-3">
            <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                <h4 class="fw-bold"><i class="bi bi-arrow-left-right text-primary"></i> Registrar Movimentação</h4>
            </div>
            <div class="card-body p-4">

                <!-- Exibe erros de validação (ex: Estoque Insuficiente) -->
                {% if form.non_field_errors %}
                <div class="alert alert-danger">
                    {% for error in form.non_field_errors %}
                    <i class="bi bi-exclamation-triangle-fill"></i> {{ error }}
                    {% endfor %}
                </div>
                {% endif %}

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label fw-medium">Produto</label>
                        {{ form.produto }}
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-medium">Tipo de Movimentação</label>
                            {{ form.tipo }}
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-medium">Quantidade</label>
                            {{ form.quantidade }}
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-medium">Observações (Opcional)</label>
                        {{ form.observacao }}
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{% url 'dashboard' %}" class="btn btn-light">Cancelar</a>
                        <button type="submit" class="btn btn-primary px-4">Registrar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
