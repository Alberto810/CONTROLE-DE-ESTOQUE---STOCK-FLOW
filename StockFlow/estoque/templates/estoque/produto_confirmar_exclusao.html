<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excluir Produto - StockFlow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">

    <div class="card border-0 shadow-sm rounded-4 p-4 text-center" style="max-width: 450px; width: 100%;">
        <div class="text-danger mb-3">
            <i class="bi bi-exclamation-triangle-fill" style="font-size: 3rem;"></i>
        </div>
        <h4 class="fw-bold">Atenção!</h4>
        <p class="text-muted">Você está prestes a excluir permanentemente o produto <strong>{{ produto.nome }} (SKU: {{ produto.sku }})</strong>.</p>
        <p class="text-danger small fw-medium mb-4">Esta ação não pode ser desfeita e apagará o histórico deste item.
        </p>

        <form method="POST">
            {% csrf_token %}
            <div class="d-flex gap-2 justify-content-center">
                <a href="{% url 'dashboard' %}" class="btn btn-light border px-4">Cancelar</a>
                <button type="submit" class="btn btn-danger px-4">Sim, Excluir</button>
            </div>
        </form>
    </div>

</body>

</html>
